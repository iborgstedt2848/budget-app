function fmtDateShort(d){var p=d.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(p[1])-1]+' '+parseInt(p[2]);}
function trendsRangeFor(mode,offset){
  var t=today();
  if(mode==='day'){
    var d=new Date(t+'T12:00:00');d.setDate(d.getDate()+offset);
    var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    return {from:ds,to:ds,label:fmtDate(ds)};
  }
  if(mode==='week'){
    var d=new Date(t+'T12:00:00');d.setDate(d.getDate()+offset*7);
    var start=new Date(d);start.setDate(d.getDate()-d.getDay());
    var end=new Date(start);end.setDate(start.getDate()+6);
    var sKey=start.getFullYear()+'-'+pad(start.getMonth()+1)+'-'+pad(start.getDate());
    var eKey=end.getFullYear()+'-'+pad(end.getMonth()+1)+'-'+pad(end.getDate());
    return {from:sKey,to:eKey,label:fmtDateShort(sKey)+' – '+fmtDateShort(eKey)+', '+end.getFullYear()};
  }
  if(mode==='year'){
    var y=parseInt(t.slice(0,4))+offset;
    return {from:y+'-01-01',to:y+'-12-31',label:String(y)};
  }
  // month
  var d2=new Date(t+'T12:00:00');d2.setDate(1);d2.setMonth(d2.getMonth()+offset);
  var mk=d2.getFullYear()+'-'+pad(d2.getMonth()+1);
  var lastDay=new Date(d2.getFullYear(),d2.getMonth()+1,0).getDate();
  return {from:mk+'-01',to:mk+'-'+pad(lastDay),label:mlabel(mk)};
}
var trendsLookupMode='month',trendsLookupOffset=0;
function setTrendsLookupMode(mode){
  trendsLookupMode=mode;trendsLookupOffset=0;
  ['day','week','month','year','custom'].forEach(function(k){
    var btn=document.getElementById('tl-btn-'+k);
    if(btn)btn.className='toggle-btn toggle-btn-fixed'+(k===mode?' active':'');
  });
  renderTrendsLookupControls();
}
function trendsLookupNav(dir){
  var fwdCap=trendsLookupMode==='day'||trendsLookupMode==='week'?0:(trendsLookupMode==='year'?furthestYearOffset():furthestMonthOffset());
  var candidate=Math.min(fwdCap,trendsLookupOffset+dir);
  var r=trendsRangeFor(trendsLookupMode,candidate);
  if(r.from>=EARLIEST_MONTH+'-01')trendsLookupOffset=candidate;
  renderTrendsLookupControls();
}
function renderTrendsLookupControls(){
  var el=document.getElementById('tl-controls');if(!el)return;
  if(trendsLookupMode==='custom'){
    el.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
      +'<div><label class="flabel">From</label><input type="date" id="tl-from" min="'+EARLIEST_MONTH+'-01"></div>'
      +'<div><label class="flabel">To</label><input type="date" id="tl-to" min="'+EARLIEST_MONTH+'-01"></div></div>'
      +'<button class="btn" onclick="lookupSpend()" style="width:100%;margin-bottom:12px">Look up</button>';
    var mr=periodRange('month');
    document.getElementById('tl-from').value=mr.from;
    document.getElementById('tl-to').value=mr.to;
  } else {
    var r=trendsRangeFor(trendsLookupMode,trendsLookupOffset);
    var fwdCap0=trendsLookupMode==='day'||trendsLookupMode==='week'?0:(trendsLookupMode==='year'?furthestYearOffset():furthestMonthOffset());
    var atPresent=trendsLookupOffset>=fwdCap0;
    el.innerHTML='<div class="rb" style="margin-bottom:12px">'
      +'<button class="btn btn-o btn-sm" onclick="trendsLookupNav(-1)">←</button>'
      +'<div style="font-weight:600;font-size:14px">'+r.label+'</div>'
      +'<button class="btn btn-o btn-sm" onclick="trendsLookupNav(1)"'+(atPresent?' disabled style="opacity:.35;cursor:default"':'')+'>→</button>'
      +'</div>';
  }
  lookupSpend();
}

var lookupCatOpen={},lookupSubOpen={};
function toggleLookupCat(catId){lookupCatOpen[catId]=!lookupCatOpen[catId];lookupSpend();}
function toggleLookupSub(catId,subId){var k=catId+'|'+subId;lookupSubOpen[k]=!lookupSubOpen[k];lookupSpend();}
function lookupSpend(){
  var from,to;
  if(trendsLookupMode==='custom'){
    var fromEl=document.getElementById('tl-from'),toEl=document.getElementById('tl-to');
    from=fromEl?fromEl.value:'';to=toEl?toEl.value:'';
  } else {
    var r=trendsRangeFor(trendsLookupMode,trendsLookupOffset);
    from=r.from;to=r.to;
  }
  var resEl=document.getElementById('tl-result');if(!resEl)return;
  if(!from||!to){resEl.innerHTML='<div style="color:var(--muted);font-size:13px">Pick both dates.</div>';return;}
  if(from>to){resEl.innerHTML='<div style="color:var(--red);font-size:13px">"From" must be on or before "To".</div>';return;}
  var inRange=txns.filter(function(t){return t.type==='expense'&&t.date>=from&&t.date<=to;});
  var total=inRange.reduce(function(s,t){return s+Number(t.amount);},0);
  var byCat={};
  inRange.forEach(function(t){
    if(!byCat[t.catId])byCat[t.catId]={catId:t.catId,total:0,txns:[]};
    byCat[t.catId].total+=Number(t.amount);
    byCat[t.catId].txns.push(t);
  });
  var catList=Object.keys(byCat).map(function(k){return byCat[k];}).sort(function(a,b){return b.total-a.total;});
  var html='<div style="font-size:24px;font-weight:700;color:var(--amber)">'+fmt(total)+'</div>';
  html+='<div style="font-size:12px;color:var(--muted);margin-bottom:10px">'+inRange.length+' transaction'+(inRange.length!==1?'s':'')+' · '+fmtDate(from)+' – '+fmtDate(to)+'</div>';
  catList.forEach(function(entry){
    var label=liveCatInfo(entry.txns[0]).cat;
    var pct=total>0?Math.round(entry.total/total*100):0;
    var open=!!lookupCatOpen[entry.catId];
    html+='<div class="bva-row" style="cursor:pointer" onclick="toggleLookupCat(\''+entry.catId+'\')"><div class="bva-name">'+escHtml(label)+'</div>'
      +'<div class="bva-bar-wrap"><div class="bva-bar" style="width:'+pct+'%;background:var(--amber)"></div></div>'
      +'<div class="bva-nums">'+fmt(entry.total)+' ('+pct+'%)</div>'

function updateHYSA(val){
  var v=parseFloat(val)||0;
  var hysa=Array.isArray(accounts)?accounts.find(function(a){return a.id==='marcusHYSA';}):null;
  if(hysa)hysa.balance=v;

}
function saveEFSettings(){
  var months=parseInt(document.getElementById('ef-slider').value)||6;
  var contrib=parseFloat(document.getElementById('ef-contrib').value)||0;
  profile.efMonths=months;profile.efContrib=contrib;
  persist();toast('Saved!');
}

function refreshEF(){
  var slider=document.getElementById('ef-slider');if(!slider)return;
  var months=parseInt(slider.value)||6;if(months<1)months=1;
  var contrib=parseFloat(document.getElementById('ef-contrib').value)||0;
  var hysaAcct=Array.isArray(accounts)?accounts.find(function(a){return a.id==='marcusHYSA';}):null;
  var saved=hysaAcct?Number(hysaAcct.balance||0):0;
  var monthly=totalBudgetedMo(),goal=Math.round(monthly*months);
  var remaining=Math.max(0,goal-saved),pct=Math.min(100,goal>0?Math.round(saved/goal*100):0);
  var moToGoal=contrib>0?Math.ceil(remaining/contrib):null;
  var goalEl=document.getElementById('ef-goal');
  if(goalEl){
    goalEl.innerHTML=(moToGoal&&moToGoal>0?'<div style="font-size:13px;color:var(--muted);margin-bottom:10px">At '+fmt(contrib)+'/mo, you will reach your savings goal in <strong style="color:var(--green)">'+moToGoal+' months</strong> (~'+(moToGoal/12).toFixed(1)+' years).</div>':'')
      +'<div class="efbar"><div class="efill" style="width:'+pct+'%"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px"><span>'+fmt(saved)+'</span><span>'+fmt(goal)+'</span></div>'
      +(pct>=100?'<div style="margin-top:8px;color:var(--green);font-weight:500">Goal reached!</div>':'');
  }
  var ms=[0.25,0.5,0.75,1].map(function(p){return{label:Math.round(p*100)+'%',mo:contrib>0?Math.ceil(Math.max(0,goal*p-saved)/contrib):null};});
  var milesEl=document.getElementById('ef-miles');
  if(milesEl)milesEl.innerHTML='<div class="ct" style="margin-bottom:8px">Milestones</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'
    +ms.map(function(m){return '<div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center"><div style="font-size:20px;font-weight:700">'+m.label+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">'+(m.mo!==null?(m.mo<=0?'Done!':m.mo+' mo'):'—')+'</div></div>';}).join('')+'</div>';
}

var _dragIdx=null;
function acctDragStart(e,idx){_dragIdx=idx;setTimeout(function(){var rows=document.querySelectorAll('.acct-row');if(rows[idx])rows[idx].classList.add('dragging');},0);}
function acctDragOver(e){e.preventDefault();var rows=document.querySelectorAll('.acct-row');rows.forEach(function(r){r.classList.remove('drag-over');});var row=e.currentTarget;if(row)row.classList.add('drag-over');}
function acctDrop(e,toIdx){
  e.preventDefault();
  if(_dragIdx===null||_dragIdx===toIdx)return;
  var moved=accounts.splice(_dragIdx,1)[0];
  accounts.splice(toIdx,0,moved);
  persist();renderNetWorth();
}
function acctDragEnd(){_dragIdx=null;document.querySelectorAll('.acct-row').forEach(function(r){r.classList.remove('dragging','drag-over');});}

  html+='<div class="card"><div class="rb"><div class="ct" style="margin:0">Accounts</div><button class="btn btn-sm" onclick="openAddAcctModal()">+ Add</button></div>';

    html+='<button class="btn btn-danger btn-sm" onclick="deleteAcct('+i+')" style="padding:4px 8px">&times;</button>';
    html+='</div>';
  });

  // Log a reimbursement — bumps whichever account the chosen reimbursement method

  if(reimMethods.length){

    }

    html+='<div><label class="flabel">Amount ($)</label><input type="number" id="rb-amt" placeholder="0.00" min="0" step="0.01"></div>';
    html+='<div><label class="flabel">Date</label><input type="date" id="rb-date" value="'+today()+'"></div>';
    html+='</div><button class="btn" style="width:100%;margin-top:10px" onclick="doReimbursement()">Log reimbursement</button>';
  } else {
    html+='<div style="font-size:13px;color:var(--muted)">Add a reimbursement method and link it to an account under Settings → Manage reimbursements to enable this.</div>';
  }
  html+='</div>';

  // Pay credit card balance — you enter the amount yourself (we don't know your statement
  // cycle/balance), it just subtracts from the checking/cash account you paid it from.
  var ccMethods=paymentMethods.filter(pmIsCreditCard);
  var fromOpts='<option value="">— Select account —</option>'+accounts.map(function(a,i){return '<option value="'+i+'">'+escHtml(a.label)+'</option>';}).join('');
  html+='<div class="card"><div class="ct">Pay credit card balance</div>';

    var ccOpts='<option value="">— Select card —</option>'+ccMethods.map(function(pm){return '<option value="'+escHtml(pm.label)+'">'+escHtml(pm.label)+'</option>';}).join('');
    html+='<div style="display:grid;gap:10px">';
    html+='<div><label class="flabel">Which card</label><select id="cc-card">'+ccOpts+'</select></div>';
    html+='<div><label class="flabel">Paying from</label><select id="cc-from">'+fromOpts+'</select></div>';

  html+='<div class="transfer-arrow">→</div>';
  html+='<div><label class="flabel">To</label><select id="tr-to"><option value="">— Select account —</option>'+accounts.map(function(a,i){return '<option value="'+i+'">'+escHtml(a.label)+'</option>';}).join('')+'</select></div></div>';

  html+='<button id="nwt-toggle-ann" class="toggle-btn '+(nwTransferView==='annual'?'active':'')+'" onclick="setNwTransferView(\'annual\')">Annual</button></div></div>';
  html+='<div id="nw-transfers"></div></div>';

  document.getElementById('tab-networth').innerHTML=html;

}
// Resolves a reimbursement method (by id, or the first configured one if none given)
// to the account it auto-adds to.
function reimbursementAccount(methodId){
  var rm=methodId?(reimbursementMethods||[]).find(function(r){return r.id===methodId;}):(reimbursementMethods||[])[0];
  if(!rm||!rm.linkedAccountId)return null;
  return accounts.find(function(a){return a.id===rm.linkedAccountId;})||null;
}
var nwTransferView='monthly',nwTransferMonthOffset=0,nwTransferYearOffset=0;
function setNwTransferView(v){
  nwTransferView=v;nwTransferMonthOffset=0;nwTransferYearOffset=0;
  var mo=document.getElementById('nwt-toggle-mo'),ann=document.getElementById('nwt-toggle-ann');
  if(mo)mo.className='toggle-btn'+(v==='monthly'?' active':'');
  if(ann)ann.className='toggle-btn'+(v==='annual'?' active':'');
  renderNwActivity();
}
function nwTransferNav(dir){
  if(nwTransferView==='annual')nwTransferYearOffset=Math.max(parseInt(EARLIEST_YEAR)-new Date(today()+'T12:00:00').getFullYear(),Math.min(furthestYearOffset(),nwTransferYearOffset+dir));
  else nwTransferMonthOffset=(monthKeyFromOffset(Math.min(furthestMonthOffset(),nwTransferMonthOffset+dir))<EARLIEST_MONTH)?nwTransferMonthOffset:Math.min(furthestMonthOffset(),nwTransferMonthOffset+dir);
  renderNwActivity();
}
// Apply/reverse the account-balance effects of a transfer/ccpayment/reimbursement, so
// editing or deleting one correctly undoes and redoes its effect on the right account(s).
function applyActivity(t){
  if(t.kind==='transfer'){
    var fa=accounts.find(function(a){return a.id===t.fromAcctId;}),ta=accounts.find(function(a){return a.id===t.toAcctId;});
    if(fa)fa.balance=Math.max(0,Number(fa.balance||0)-Number(t.amount));
    if(ta)ta.balance=Number(ta.balance||0)+Number(t.amount);
  } else if(t.kind==='ccpayment'){
    var fromA=accounts.find(function(a){return a.id===t.fromAcctId;});
    if(fromA)fromA.balance=Math.max(0,Number(fromA.balance||0)-Number(t.amount));
  } else if(t.kind==='reimbursement'){
    var toA=accounts.find(function(a){return a.id===t.toAcctId;});
    if(toA)toA.balance=Number(toA.balance||0)+Number(t.amount);
  }
}
function reverseActivity(t){
  if(t.kind==='transfer'){
    var fa=accounts.find(function(a){return a.id===t.fromAcctId;}),ta=accounts.find(function(a){return a.id===t.toAcctId;});
    if(fa)fa.balance=Number(fa.balance||0)+Number(t.amount);
    if(ta)ta.balance=Math.max(0,Number(ta.balance||0)-Number(t.amount));
  } else if(t.kind==='ccpayment'){
    var fromA=accounts.find(function(a){return a.id===t.fromAcctId;});
    if(fromA)fromA.balance=Number(fromA.balance||0)+Number(t.amount);
  } else if(t.kind==='reimbursement'){
    var toA=accounts.find(function(a){return a.id===t.toAcctId;});
    if(toA)toA.balance=Math.max(0,Number(toA.balance||0)-Number(t.amount));
  }
}
function renderNwActivity(){
  var el=document.getElementById('nw-transfers');if(!el)return;
  var isAnn=nwTransferView==='annual';
  var d=new Date(today()+'T12:00:00');
  var mk,yr;
  if(isAnn){yr=String(d.getFullYear()+nwTransferYearOffset);}
  else{var dd=new Date(today()+'T12:00:00');dd.setDate(1);dd.setMonth(dd.getMonth()+nwTransferMonthOffset);mk=dd.getFullYear()+'-'+pad(dd.getMonth()+1);}
  var periodLabel=isAnn?yr:mlabel(mk);
  var atPresent=isAnn?nwTransferYearOffset>=furthestYearOffset():nwTransferMonthOffset>=furthestMonthOffset();
  var html='<div class="rb" style="margin:-2px 0 10px">'
    +'<button class="btn btn-o btn-sm" onclick="nwTransferNav(-1)">←</button>'
    +'<div style="font-weight:600;font-size:14px">'+periodLabel+'</div>'
    +'<button class="btn btn-o btn-sm" onclick="nwTransferNav(1)"'+(atPresent?' disabled style="opacity:.35;cursor:default"':'')+'>→</button>'
    +'</div>';
  var inRange=txns.filter(function(t){return t.type==='transfer'&&(isAnn?t.date.startsWith(yr):t.date.startsWith(mk));}).sort(function(a,b){return b.date.localeCompare(a.date);});
  if(inRange.length){
    html+=inRange.map(function(t){
      var idx=txns.indexOf(t);
      var dt=new Date(t.date+'T12:00:00'),ds=(dt.getMonth()+1)+'/'+dt.getDate();
      return '<div class="act">'
        +'<span class="tdesc">'+(t.desc?escHtml(t.desc):'Activity')+'</span>'
        +'<span class="tamt" style="color:var(--blue)">'+fmt(t.amount,2)+'</span>'
        +'<span class="tdate">'+ds+'</span>'
        +'<span class="tdel t-edit" onclick="openEditActivityModal('+idx+')" title="Edit">✎</span>'
        +'<span class="tdel t-del" onclick="deleteActivity('+idx+')" title="Delete">&times;</span>'
        +'</div>';
    }).join('');
  } else {
    html+='<div style="color:var(--muted);font-size:13px;padding:8px 0">No activity in this period.</div>';
  }
  el.innerHTML=html;
}
function openEditActivityModal(idx){
  var t=txns[idx];if(!t)return;
  openModal('<h3>Edit activity</h3><div style="display:grid;gap:10px">'
    +'<div><label class="flabel">Description</label><input id="ea-desc" value="'+escHtml(t.desc||'')+'"></div>'
    +'<div><label class="flabel">Amount ($)</label><input type="number" id="ea-amt" value="'+Number(t.amount).toFixed(2)+'" min="0" step="0.01"></div>'
    +'<div><label class="flabel">Date</label><input type="date" id="ea-date" value="'+(t.date||today())+'"></div>'
    +'</div><div class="modal-footer">'
    +'<button class="btn btn-danger" onclick="deleteActivityFromModal('+idx+')" style="margin-right:auto">Delete</button>'
    +'<button class="btn btn-o" onclick="closeModal()">Cancel</button>'
    +'<button class="btn" onclick="confirmEditActivity('+idx+')">Save</button></div>');
}
function confirmEditActivity(idx){
  var t=txns[idx];if(!t)return;
  var amt=parseFloat(document.getElementById('ea-amt').value);
  if(!amt||amt<=0){alert('Enter a valid amount.');return;}
  reverseActivity(t);
  t.desc=document.getElementById('ea-desc').value.trim();
  t.amount=amt;
  t.date=document.getElementById('ea-date').value||today();
  applyActivity(t);
  persist();closeModal();renderNetWorth();toast('Updated!');
}
function deleteActivity(idx){
  if(confirm('Delete this activity?')){
    var t=txns[idx];
    if(t)reverseActivity(t);
    txns.splice(idx,1);persist();renderNetWorth();toast('Deleted.');
  }
}
function deleteActivityFromModal(idx){
  if(confirm('Delete this activity?')){
    var t=txns[idx];
    if(t)reverseActivity(t);
    txns.splice(idx,1);persist();closeModal();renderNetWorth();toast('Deleted.');
  }
}
function doReimbursement(){
  var methodEl=document.getElementById('rb-method');
  var acct=reimbursementAccount(methodEl?methodEl.value:null);if(!acct)return;
  var desc=document.getElementById('rb-desc').value.trim();
  var amt=parseFloat(document.getElementById('rb-amt').value)||0;
  var date=document.getElementById('rb-date').value||today();
  if(!amt||amt<=0){alert('Enter an amount.');return;}
  var t={desc:desc?desc:'reimbursement',subId:'transfer',catId:'transfer',subcatLabel:'Transfer',catLabel:'Transfer',color:'#6aabf0',amount:amt,type:'transfer',date:date,kind:'reimbursement',toAcctId:acct.id};
  txns.push(t);
  applyActivity(t);
  persist();
  document.getElementById('rb-desc').value='';
  document.getElementById('rb-amt').value='';
  toast(fmt(amt,2)+' reimbursement logged');renderNetWorth();
}
function doCCPayment(){
  var cardName=document.getElementById('cc-card').value.trim();
  var fi=document.getElementById('cc-from').value;
  if(!cardName){alert('Enter which card you\'re paying.');return;}
  if(fi===''){alert('Select which account the payment is coming from.');return;}
  fi=parseInt(fi);
  var amt=parseFloat(document.getElementById('cc-amt').value)||0;
  if(!amt||amt<=0){alert('Enter a payment amount.');return;}
  var from=accounts[fi];if(!from)return;
  var t={desc:('Paid '+cardName+' from '+from.label).toLowerCase(),subId:'transfer',catId:'transfer',subcatLabel:'Transfer',catLabel:'Transfer',color:'#6aabf0',amount:amt,type:'transfer',date:today(),kind:'ccpayment',fromAcctId:from.id};
  txns.push(t);
  applyActivity(t);
  persist();
  document.getElementById('cc-amt').value='';
  document.getElementById('cc-card').value='';
  document.getElementById('cc-from').value='';
  toast(fmt(amt,2)+' payment logged');renderNetWorth();
}

function updateAccountBalance(idx,val){
  if(!accounts[idx])return;
  accounts[idx].balance=parseFloat(val)||0;
  persist();
  renderNetWorth();

// ─── TRAVEL ───────────────────────────────────────────────────────────────────
function renderTravel(){
  var sorted=trips.slice().sort(function(a,b){return b.startDate.localeCompare(a.startDate);});
  var html='<div class="rb"><div style="font-size:16px;font-weight:600">Trips</div><button class="btn btn-sm" onclick="openAddTripModal()">+ New trip</button></div>';
  if(!sorted.length){
    html+='<div style="color:var(--muted);font-size:14px;padding:24px 0;text-align:center">No trips yet. Create one to start tracking travel expenses.</div>';
  } else {
    sorted.forEach(function(trip){
      var tripTxns=txns.filter(function(t){return t.tripId===trip.id&&t.type==='expense';});
      var total=tripTxns.reduce(function(s,t){return s+Number(t.amount);},0);
      var isExp=expandedTrip===trip.id;
      html+='<div class="trip-card'+(isExp?' expanded':'')+'" onclick="'+(isExp?'':'toggleTrip(\''+trip.id+'\')')+'">';
      html+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">';
      html+='<div><div style="font-size:16px;font-weight:600">'+escHtml(trip.name)+'</div>';
      if(trip.location)html+='<div style="font-size:13px;color:var(--muted);margin-top:2px">'+escHtml(trip.location)+'</div>';
      html+='<div style="font-size:12px;color:var(--hint);margin-top:3px">'+fmtDate(trip.startDate)+(trip.endDate&&trip.endDate!==trip.startDate?' – '+fmtDate(trip.endDate):'')+'</div></div>';
      html+='<div style="text-align:right;flex-shrink:0"><div style="font-size:18px;font-weight:700;color:var(--amber)">'+fmt(total)+'</div>';
      html+='<div style="font-size:12px;color:var(--muted)">'+tripTxns.length+' transaction'+(tripTxns.length!==1?'s':'')+'</div></div></div>';
      if(isExp){
        html+='<div class="trip-detail">';
        // Category breakdown — click a category to reveal/hide its transactions
        var bycat={};
        tripTxns.forEach(function(t){var c=liveCatInfo(t).cat||'Other';if(!bycat[c])bycat[c]={total:0,txns:[]};bycat[c].total+=Number(t.amount);bycat[c].txns.push(t);});
        var topCats=Object.keys(bycat).map(function(k){return {name:k,data:bycat[k]};}).sort(function(a,b){return b.data.total-a.data.total;});
        if(topCats.length){
          html+='<div class="ct">Spending by category</div>';
          topCats.forEach(function(e,ei){
            var pct=total>0?Math.round(e.data.total/total*100):0;
            var key=trip.id+'|'+ei,open=!!tripCatOpen[key];
            html+='<div class="bva-row" style="cursor:pointer" onclick="event.stopPropagation();toggleTripCat(\''+trip.id+'\','+ei+')"><div class="bva-name">'+escHtml(e.name)+'</div>'
              +'<div class="bva-bar-wrap"><div class="bva-bar" style="width:'+pct+'%;background:var(--amber)"></div></div>'
              +'<div class="bva-nums">'+fmt(e.data.total)+' ('+pct+'%)</div>'
              +'<div style="font-size:11px;color:var(--hint);margin-left:2px;flex-shrink:0">'+(open?'▾':'▸')+'</div></div>';
            if(open){
              html+='<div style="padding:0 0 6px 12px">';
              e.data.txns.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(t){
                var d=new Date(t.date+'T12:00:00'),ds=(d.getMonth()+1)+'/'+(d.getDate()),info=liveCatInfo(t);
                html+='<div class="brow" style="padding:7px 0" onclick="event.stopPropagation()"><div class="bn" style="font-size:13px">'+escHtml(t.desc||'—')+(info.sub&&info.sub!==info.cat?'<div class="bsub">'+escHtml(info.sub)+'</div>':'')+'</div><div style="color:var(--muted);font-size:12px;width:32px;flex-shrink:0">'+ds+'</div><div style="font-weight:600;font-size:13px;width:66px;flex-shrink:0;text-align:right">'+fmt(t.amount,2)+'</div></div>';
              });
              html+='</div>';
            }
          });
        }
        // All of this trip's transactions in chronological order, same row format as
        // Tracker → Transactions (category pill, description, amount, date).
        if(tripTxns.length){
          html+='<div class="ct" style="margin-top:14px">All transactions</div>';
          tripTxns.slice().sort(function(a,b){return b.date.localeCompare(a.date)||txns.indexOf(b)-txns.indexOf(a);}).forEach(function(t){
            var idx=txns.indexOf(t),info=liveCatInfo(t),col=info.color;
            var d=new Date(t.date+'T12:00:00'),ds=(d.getMonth()+1)+'/'+(d.getDate());
            var label=info.sub&&info.sub!==info.cat?info.sub:info.cat;
            html+='<div class="txn" onclick="event.stopPropagation()">'
              +'<span class="tcp" style="background:'+col+'22;color:'+col+'">'+escHtml(label)+'</span>'
              +'<span class="tdesc">'+(t.desc?escHtml(t.desc):'—')+'</span>'
              +'<span class="tamt">'+fmt(t.amount,2)+'</span>'
              +'<span class="tdate">'+ds+'</span>'
              +'<span class="tdel t-edit" onclick="openEditTxnModal('+idx+')" title="Edit">✎</span>'
              +'<span class="tdel t-del" onclick="delTxn('+idx+')" title="Delete">&times;</span>'
              +'</div>';
          });
        }
        html+='<div style="display:flex;gap:8px;margin-top:14px">';
        html+='<button class="btn btn-o btn-sm" onclick="event.stopPropagation();toggleTrip(\''+trip.id+'\')">Collapse</button>';
        html+='<button class="btn btn-o btn-sm" onclick="event.stopPropagation();openEditTripModal(\''+trip.id+'\')">Edit trip</button>';
        html+='<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTrip(\''+trip.id+'\')">Delete trip</button>';
        html+='</div></div>';
      } else {
        html+='<div style="font-size:12px;color:var(--muted);margin-top:8px">Tap to expand</div>';
      }
      html+='</div>';
    });
  }
  document.getElementById('tab-travel').innerHTML=html;
}

function saveProfile(){
  profile.title           =document.getElementById('s-title').value.trim()||'My Budget';

  profile.location        =document.getElementById('s-location').value.trim();
  profile.startDate       =document.getElementById('s-startdate').value;
  profile.baseSalary      =parseFloat(document.getElementById('s-base').value)||60000;
  profile.taxRate         =parseFloat(document.getElementById('s-tax').value)||28;
  profile.commission      =parseFloat(document.getElementById('s-commission').value)||0;
  profile.commissionTaxRate=parseFloat(document.getElementById('s-commtax').value)||36;
  // Derive OTE: base + commission for backward compatibility
  profile.oteSalary       =profile.baseSalary+(profile.commission||0);
  persist();updateHeader();toast('Profile saved!',1800);
}

var _incDragIdx=null;
function incDragStart(e,idx){_incDragIdx=idx;}
function incDrop(e,toIdx){

// Sync actions
function copyAppsScript(){
  // Chunks the JSON across multiple cells (a single cell caps out at ~50,000 characters,
  // which silently broke syncing once real usage data grew past it), plus a lock and an
  // explicit flush so a read can never land in the middle of a write.
  var code='var SHEET_NAME = \'BudgetData\';\n'
    +'var CHUNK_SIZE = 45000; // stay safely under Sheets\' ~50,000 char/cell limit\n\n'
    +'function getSheet_() {\n'
    +'  var ss = SpreadsheetApp.getActiveSpreadsheet();\n'
    +'  return ss.getSheetByName(SHEET_NAME) || ss.insertSheet(SHEET_NAME);\n'
    +'}\n\n'
    +'function doGet(e) {\n'
    +'  var lock = LockService.getScriptLock();\n'
    +'  try {\n'
    +'    lock.waitLock(10000);\n'
    +'    var sheet = getSheet_();\n'
    +'    var lastRow = sheet.getLastRow();\n'
    +'    var data = \'\';\n'
    +'    if (lastRow > 0) {\n'
    +'      var values = sheet.getRange(1, 1, lastRow, 1).getValues();\n'
    +'      data = values.map(function (r) { return r[0] || \'\'; }).join(\'\');\n'
    +'    }\n'
    +'    var result = data ? JSON.parse(data) : {\n'
    +'      schema: [], txns: [], accounts: [], profile: {}, trips: [],\n'
    +'      incomeSources: [], paymentMethods: [], reimbursementMethods: [],\n'
    +'      budgetSnapshots: {}, budgetSnapshotsAnnual: {}\n'
    +'    };\n'
    +'    return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);\n'
    +'  } catch (err) {\n'
    +'    return ContentService.createTextOutput(JSON.stringify({ error: err.toString() })).setMimeType(ContentService.MimeType.JSON);\n'
    +'  } finally {\n'
    +'    lock.releaseLock();\n'
    +'  }\n'
    +'}\n\n'
    +'function doPost(e) {\n'
    +'  var lock = LockService.getScriptLock();\n'
    +'  try {\n'
    +'    lock.waitLock(10000);\n'
    +'    var payload = e.postData.contents;\n'
    +'    JSON.parse(payload);\n\n'
    +'    var sheet = getSheet_();\n'
    +'    sheet.clearContents();\n'
    +'    var chunks = [];\n'
    +'    for (var i = 0; i < payload.length; i += CHUNK_SIZE) {\n'
    +'      chunks.push([payload.substr(i, CHUNK_SIZE)]);\n'
    +'    }\n'
    +'    if (chunks.length) {\n'
    +'      sheet.getRange(1, 1, chunks.length, 1).setValues(chunks);\n'
    +'    }\n'
    +'    SpreadsheetApp.flush();\n'
    +'    return ContentService.createTextOutput(JSON.stringify({ status: \'ok\' })).setMimeType(ContentService.MimeType.JSON);\n'
    +'  } catch (err) {\n'
    +'    return ContentService.createTextOutput(JSON.stringify({ error: err.toString() })).setMimeType(ContentService.MimeType.JSON);\n'
    +'  } finally {\n'
    +'    lock.releaseLock();\n'
    +'  }\n'
    +'}';
  navigator.clipboard.writeText(code).then(function(){toast('Copied! Paste into Extensions → Apps Script.');}).catch(function(){var ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Copied!');});
}

// Backup
function exportJSON(){
  var data={profile:profile,schema:schema,txns:txns,accounts:accounts,incomeSources:incomeSources,trips:trips,paymentMethods:paymentMethods,reimbursementMethods:reimbursementMethods,budgetSnapshots:budgetSnapshots,budgetSnapshotsAnnual:budgetSnapshotsAnnual,exported:new Date().toISOString()};
  var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='budget-backup-'+today()+'.json';a.click();toast('Backup downloaded!');
}
function importJSON(ev){
  var file=ev.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.schema&&data.txns){
        if(confirm('Replace all data with this backup?')){
          var url=profile.scriptUrl;
          if(data.profile)profile=data.profile;
          schema=data.schema;txns=data.txns;
          if(data.accounts)accounts=data.accounts;
          if(data.incomeSources)incomeSources=data.incomeSources;
          if(data.trips)trips=data.trips;
          if(data.paymentMethods)paymentMethods=data.paymentMethods;
          if(data.reimbursementMethods)reimbursementMethods=data.reimbursementMethods;
          if(data.budgetSnapshots)budgetSnapshots=data.budgetSnapshots;
          if(data.budgetSnapshotsAnnual)budgetSnapshotsAnnual=data.budgetSnapshotsAnnual;
          profile.scriptUrl=url;persist();updateHeader();toast('Imported!');renderSettings();
        }
      }else{alert('Invalid file.');}
    }catch(err){alert('Error: '+err.message);}
  };
  reader.readAsText(file);
}
function clearTxns(){if(confirm('Clear all transactions? Budget, accounts, and settings stay.')){txns=[];persist();toast('Transactions cleared.');renderSettings();}}
function resetAll(){
  if(confirm('Delete EVERYTHING and reset to defaults?')){
    if(confirm('Really sure? Cannot be undone.')){
      var url=profile.scriptUrl;
      profile=clone(DEFAULT_PROFILE);schema=clone(DEFAULT_SCHEMA);
      txns=[];accounts=clone(DEFAULT_ACCOUNTS_LIST);incomeSources=clone(DEFAULT_INCOME_SOURCES);trips=[];
      paymentMethods=clone(DEFAULT_PAYMENT_METHODS);budgetSnapshots={};budgetSnapshotsAnnual={};
      profile.scriptUrl=url;persist();updateHeader();toast('Reset.');renderSettings();
    }
  }
}

  if(id==='budget')   renderBudget();
  if(id==='tracker')  buildTracker();
  if(id==='trends')   renderTrends();
  if(id==='savings')  buildSavings();
  if(id==='networth') renderNetWorth();
  if(id==='travel')   renderTravel();
  if(id==='settings') renderSettings();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateHeader();
var _startTab=localStorage.getItem('bgt_active_tab')||'overview';
// Repair any duplicate categories/subcategories left over from earlier "Add category
// didn't seem to work so I tried again" attempts. Runs on whatever data ends up
// authoritative (post-pull if synced), so the cleanup itself also syncs back out.
// Cheap and a no-op once clean, so it's safe to run on every load.
function afterInitialSync(){
  var changed=dedupeCategoriesAndSubcategories();
  try{
    if(!localStorage.getItem('bgt_migrated_unified_budget_v1')){
      migrateToUnifiedBudget();
      localStorage.setItem('bgt_migrated_unified_budget_v1','1');
      changed=true;
    }
    if(!localStorage.getItem('bgt_colors_standardized_v1')){
      standardizeCategoryColors();
      localStorage.setItem('bgt_colors_standardized_v1','1');
      changed=true;
    }
  }catch(e){}
  if(changed){persist();updateHeader();}
  showTab(_startTab);
}
if(hasSyncConfig()){
  pullFromCloud(function(ok){updateHeader();afterInitialSync();});
}else{
  afterInitialSync();
}
</script>
</body>
</html>
